name: Deploy to Cloudflare Pages

# 2026-11-11：網站同時部署到 Cloudflare Pages（aronlab.dev）。
# 搬家期間 GitHub Pages 照常運作，兩邊同時上線，確認沒問題才切換。
# 觸發：push 到 main、手動 workflow_dispatch。
# 需要倉庫 Secrets：CLOUDFLARE_API_TOKEN（Account › Cloudflare Pages › Edit）、CLOUDFLARE_ACCOUNT_ID；還沒設定時直接略過。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT: aronlab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Secrets 還沒設定就略過
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 還沒設定，這次不部署。"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: main

      - name: 準備上傳的網站資料夾（倉庫根目錄）
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' ./ "$RUNNER_TEMP/site/"
          # OneStroke 上線到 onestroke.aronlab.dev 時：把 onestroke/ 資料夾搬過去，這裡照 daybreak 的寫法加 /onestroke 和 /onestroke/* 兩行
          printf '%s\n' '/daybreak https://daybreak.aronlab.dev/ 301' '/daybreak/* https://daybreak.aronlab.dev/:splat 301' '/tidemark https://tidemark.aronlab.dev/ 301' '/tidemark/* https://tidemark.aronlab.dev/:splat 301' '/morningbell https://morningbell.aronlab.dev/ 301' '/morningbell/* https://morningbell.aronlab.dev/:splat 301' '/signals https://signals.aronlab.dev/ 301' '/signals/* https://signals.aronlab.dev/:splat 301' '/market-ticker https://ticker.aronlab.dev/ 301' '/market-ticker/* https://ticker.aronlab.dev/:splat 301' '/paypulse https://paypulse.aronlab.dev/ 301' '/paypulse/* https://paypulse.aronlab.dev/:splat 301' >> "$RUNNER_TEMP/site/_redirects"
          # 2026-11-12：作品資料與程式沒有版本號，Cloudflare 預設讓瀏覽器快取 4 小時，改了連結訪客還看到舊的；
          # 改成每次都向伺服器確認（沒變只回 304，幾乎不影響速度）
          printf '%s\n' '/data/*' '  Cache-Control: no-cache' '/assets/app.js' '  Cache-Control: no-cache' '/assets/app.css' '  Cache-Control: no-cache' >> "$RUNNER_TEMP/site/_headers"
          echo "SITE_DIR=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          echo "files: $(find "$RUNNER_TEMP/site" -type f | wc -l)"

      - name: 確認 Pages 專案存在（第一次會建立）
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: 部署
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.SITE_DIR }} --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
